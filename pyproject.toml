[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "celery-task-queue"
version = "0.1.0"
description = "Celery task-queue starter — tasks, retries, workflows, eager-mode tests, Docker. — by Viprasol Tech."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = ["celery", "task-queue", "redis", "background-jobs", "worker", "async", "distributed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = ["celery>=5.3"]

[project.optional-dependencies]
redis = ["celery[redis]>=5.3", "redis>=5.0"]
monitoring = ["flower>=2.0"]
dev = ["ruff>=0.6", "mypy>=1.10", "pytest>=8.0"]

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/celery-task-queue"
Issues = "https://github.com/Viprasol-Tech/celery-task-queue/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/celery_task_queue"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
# Celery's @shared_task decorator is untyped; allow it without losing strictness
# everywhere else.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
